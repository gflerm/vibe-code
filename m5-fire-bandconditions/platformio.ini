[env:m5stack-fire]
platform = espressif32
board = m5stack-fire
framework = arduino

; This application fits comfortably in internal SRAM. Do not initialize the
; Fire's external PSRAM because some units fail its startup memory test.
build_unflags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200

lib_deps =
    m5stack/M5Stack
    bxparks/AceTime@^4.1.0
    adafruit/Adafruit NeoPixel@^1.15.1
